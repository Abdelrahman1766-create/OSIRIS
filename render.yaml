services:
  - type: web
    name: osiris-store-abdelrahman1766
    runtime: node
    plan: free
    region: frankfurt
    # Database migrations and catalog seeding are intentionally manual release steps.
    buildCommand: npm ci && npm ci --prefix server && npm run build && npm run build:api
    startCommand: npm start --prefix server
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CLIENT_ORIGINS
        value: https://osiris-store-abdelrahman1766.onrender.com
      - key: PUBLIC_API_ORIGIN
        value: https://osiris-store-abdelrahman1766.onrender.com
      - key: VITE_SITE_URL
        value: https://osiris-store-abdelrahman1766.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: OSIRIS Admin
      - key: VITE_WHATSAPP_NUMBER
        sync: false
      - key: VITE_TELEGRAM_USERNAME
        sync: false
      - key: VITE_MAX_CONTACT_URL
        sync: false
